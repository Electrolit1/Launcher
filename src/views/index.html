<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanheda Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- ══════════════════════════════════════════
       TITLEBAR  —  42px
  ══════════════════════════════════════════ -->
  <header class="titlebar">
    <div class="titlebar-brand drag">
      <div class="brand-mark">W</div>
      <span class="brand-name">WANHEDA <span class="brand-studio">STUDIO</span></span>
    </div>
    <div class="window-controls">
      <button id="minimize"  class="wc-btn"  title="Minimizar">─</button>
      <button id="maximize"  class="wc-btn"  title="Maximizar">□</button>
      <button id="close"     class="wc-btn wc-close" title="Cerrar">✕</button>
    </div>
  </header>

  <!-- ══════════════════════════════════════════
       MAIN SHELL
  ══════════════════════════════════════════ -->
  <div class="shell">

    <!-- ─── LEFT NAV SIDEBAR  52px ─── -->
    <nav class="nav-sidebar" id="nav-sidebar">

      <!-- Dashboard -->
      <button class="nav-btn active" data-tab="dashboard" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-tooltip">Dashboard</span>
      </button>

      <!-- Modpack Manager -->
      <button class="nav-btn" data-tab="modpack" title="Modpack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span class="nav-tooltip">Modpack</span>
      </button>

      <!-- Performance Settings -->
      <button class="nav-btn" data-tab="settings" title="Rendimiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span class="nav-tooltip">Rendimiento</span>
      </button>

      <!-- Cosmetics -->
      <button class="nav-btn" data-tab="cosmetics" title="Cosméticos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span class="nav-tooltip">Cosméticos</span>
      </button>

      <div class="nav-divider"></div>

      <!-- Account Profile -->
      <button class="nav-btn" data-tab="account" title="Mi Cuenta" id="nav-account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-tooltip">Mi Cuenta</span>
      </button>

    </nav>

    <!-- ─── MAIN CONTENT AREA ─── -->
    <main class="main-area">

      <!-- Content Header -->
      <div class="content-header">
        <span class="section-eyebrow">NOTICIAS</span>
        <div id="modpack-name" class="modpack-badge">Vacío Extremo</div>
      </div>

      <!-- News Grid -->
      <div class="news-scroll">
        <ul id="news-list"></ul>
      </div>

      <!-- Status Strip -->
      <div class="status-strip">
        <span class="strip-label">ESTADO</span>
        <span id="status" class="strip-value">Preparado</span>
      </div>

    </main>

    <!-- ─── RIGHT SYSTEM PANEL  240px ─── -->
    <aside class="sys-panel">

      <!-- Profile Card -->
      <div class="profile-card" id="profile-card">
        <img id="player-head" src="" alt="Avatar">
        <div class="profile-info">
          <span class="profile-role">JUGADOR</span>
          <p id="username">Cargando...</p>
          <div class="profile-status">
            <span class="status-dot"></span>
            <span class="status-text">Conectado</span>
          </div>
        </div>
      </div>

      <!-- System Telemetry -->
      <div class="sys-block">
        <div class="sys-block-header">SISTEMA</div>

        <div class="sys-row">
          <span class="sys-label">Minecraft</span>
          <b id="minecraft-version" class="sys-val">—</b>
        </div>
        <div class="sys-row">
          <span class="sys-label">Fabric</span>
          <b id="fabric-version" class="sys-val">—</b>
        </div>
        <div class="sys-row">
          <span class="sys-label">Java</span>
          <span id="java-status" class="sys-val">—</span>
        </div>
        <div class="sys-row no-border">
          <span class="sys-label">Modpack</span>
          <span id="modpack-status" class="sys-val">—</span>
        </div>
      </div>

      <!-- RAM Allocation -->
      <div class="ram-block">
        <div class="ram-header">
          <span class="ram-label">RAM ASIGNADA</span>
          <span class="ram-value" id="ram-display">4 GB</span>
        </div>
        <div class="slider-track">
          <input type="range" id="ram-slider" class="ram-slider"
                 min="1" max="16" value="4" step="1">
        </div>
        <div class="ram-marks">
          <span>1G</span><span>4G</span><span>8G</span><span>16G</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-block">
        <div class="bar"><div class="fill"></div></div>
        <span id="progress-text" class="progress-label">100%</span>
      </div>

      <div class="sys-spacer"></div>

      <!-- Logout — pinned bottom -->
      <button id="logout" class="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        CERRAR SESIÓN
      </button>

    </aside>

  </div>

  <!-- ══════════════════════════════════════════
       BOTTOM ACTION DOCK  —  64px
  ══════════════════════════════════════════ -->
  <footer class="action-dock">

    <div class="dock-brand">
      <div class="dock-logo">W</div>
      <span class="dock-name">WANHEDA <span class="dock-studio">STUDIO</span></span>
    </div>

    <div class="dock-actions">
      <button id="install" class="btn-verify">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        VERIFICAR ARCHIVOS
      </button>
      <button id="play" class="btn-play">JUGAR</button>
    </div>

  </footer>

  <!-- SOLO UN SCRIPT -->
  <script src="../js/app.js"></script>

  <!-- RAM Slider micro-interaction -->
  <script>
    const slider = document.getElementById('ram-slider');
    const display = document.getElementById('ram-display');
    if (slider && display) {
      slider.addEventListener('input', () => {
        display.textContent = slider.value + ' GB';
        const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
        slider.style.setProperty('--fill', pct + '%');
      });
      // Init fill
      const initPct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
      slider.style.setProperty('--fill', initPct + '%');
    }

    // Nav tab switching (visual only)
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>

</body>
</html>
