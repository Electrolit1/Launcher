<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wanheda Studio</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="titlebar">


<div class="drag">
WANHEDA STUDIO
</div>



<div class="window-buttons">


<button id="minimize">
─
</button>


<button id="maximize">
□
</button>


<button id="close">
✕
</button>


</div>


</div>





<div class="background"></div>





<div class="container">



<aside class="sidebar">



<h1>
WANHEDA
</h1>


<h2>
STUDIO
</h2>



<p class="subtitle" id="modpack-name">
Vacío Extremo
</p>





<div 
class="user-panel"
id="profile-card"
>



<div class="player-profile">



<img
id="player-head"
src=""
alt="Skin Minecraft"
>




<div>


<h3>
Jugador
</h3>


<p id="username">
Cargando...
</p>



<span>
🟢 Conectado
</span>



</div>



</div>





<div
id="profile-menu"
class="profile-menu"
>



<button id="logout">
Cerrar sesión
</button>



</div>



</div>







<div class="news">


<h3>
Noticias
</h3>



<ul id="news-list">

</ul>



</div>




</aside>









<main class="main">





<div class="status">


<h2>
Estado
</h2>


<span id="status">
Preparado
</span>



</div>







<div class="info-panel">


<h2>
Información
</h2>




<p>

Minecraft:

<b id="minecraft-version">
Cargando...
</b>


</p>





<p>

Fabric:

<b id="fabric-version">
Cargando...
</b>


</p>





<p>

Java:

<span id="java-status">
Comprobando...
</span>


</p>






<p>

Modpack:

<span id="modpack-status">
Comprobando...
</span>


</p>



</div>







<div class="progress">


<div class="bar">


<div class="fill"></div>


</div>



<span id="progress-text">
100%
</span>



</div>







<button id="play">
JUGAR
</button>





<button id="install">
INSTALAR
</button>










</main>





</div>









<!-- SOLO UN SCRIPT -->

<script src="../js/app.js"></script>



</body>

</html>
